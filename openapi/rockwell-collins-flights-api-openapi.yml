  /flights/{ident}/canonical:
    get:
      operationId: get_flights_canonical
      summary: Get the Canonical Ident of a Flight
      description: 'When the ident parameter is a code that could map to multiple other codes,

        this endpoint returns an array of information about all the possible codes.

        An optional ident type and country code can be provided to refine ambiguous

        idents to a single result. The ident type should either be designator or

        registration to describe the ident being passed in. The country code should

        represent a country the operator of the flight operates within.

        '
      tags:
      - flights
      parameters:
      - name: ident
        in: path
        description: The flight designator or aircraft registration
        required: true
        schema:
          type: string
        examples:
          ident:
            value: B6109
      - name: ident_type
        in: query
        description: Type of ident provided in the ident parameter
        schema:
          type: string
          enum:
          - designator
          - registration
      - name: country_code
        in: query
        description: An ISO 3166-1 alpha-2 country code.
        schema:
          type: string
          example: US
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                type: object
                properties:
                  idents:
                    type: array
                    items:
                      title: CanonicalIdent
                      type: object
                      properties:
                        ident:
                          type: string
                          description: 'Canonical ident

                            '
                        ident_type:
                          type: string
                          description: 'Type of ident given in id

                            '
                          enum:
                          - designator
                          - registration
                      required:
                      - ident
                      - ident_type
                required:
                - idents
        '400':
          description: 'Incorrect parameter(s). ident, ident_type, or country_code may be invalid.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /flights/{ident}/intents:
    post:
      operationId: post_flights_by_ident
      summary: Submit a Flight Intent
      description: 'This operation informs FlightAware of an upcoming (or recently

        departed) flight. This information is used solely by FlightAware for

        improving the accuracy of flight tracking. This method does not

        transmit to any ANSP/ATC facility for flight separation or operational

        services. Access to this endpoint requires special account

        authorization. The FlightAware account must also be subscribed to

        FlightAware Global and the specified registration or ident must be on

        the Global account.

        '
      tags:
      - flights
      parameters:
      - name: ident
        in: path
        description: The ident or registration of the Flight Intent
        required: true
        schema:
          type: string
        examples:
          ident:
            value: RPA4854
          reg:
            value: N123HQ
      requestBody:
        description: Flight Intent
        content:
          application/json; charset=UTF-8:
            schema:
              title: FlightIntent
              type: object
              properties:
                aircraft_type:
                  type: string
                  description: Aircraft type ICAO code.
                  example: C162
                origin:
                  type: string
                  description: Origin airport ICAO code or LID.
                  example: KSGR
                destination:
                  type: string
                  description: Destination airport ICAO code or LID.
                  example: 50R
                intended_off:
                  type: string
                  format: date-time
                  description: 'Intended runway departure time of flight. This must be within 2 hours of

                    the actual departure time or the flight intent will be ignored. Time may

                    not be more than 1 hour in the past or 48 hours in the future.

                    '
                  example: '2021-10-16T21:30:00Z'
                intended_on:
                  type: string
                  format: date-time
                  description: Intended runway arrival time of flight.
                  example: '2021-10-16T22:50:00Z'
                altitude:
                  type: integer
                  description: Cruising altitude (feet).
                  example: 3500
                airspeed:
                  type: integer
                  description: Cruising airspeed (knots).
                  example: 86
                route:
                  type: string
                  description: Flight route as a series of space-separate waypoints.
                  example: MAPGP VICUC
              required:
              - aircraft_type
              - origin
              - destination
              - intended_off
              - intended_on
      responses:
        '200':
          description: OK
        '400':
          description: 'Incorrect parameter(s). Ident may be missing or pages may be < 1. Body may be incomplete. User may lack permissions to post flight intent for this ident. Arrival/departure times, duration, or aircraft type may be invalid.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
