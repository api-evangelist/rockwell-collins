                          nullable: true
                        code_lid:
                          type: string
                          description: 'LID code

                            '
                          nullable: true
                        timezone:
                          type: string
                          description: 'Applicable timezone for the airport, in the TZ database format

                            '
                          nullable: true
                          example: America/New_York
                        name:
                          type: string
                          description: 'Common name of airport

                            '
                          nullable: true
                          example: LaGuardia
                        city:
                          type: string
                          description: 'Closest city to the airport

                            '
                          nullable: true
                          example: New York
                        airport_info_url:
                          type: string
                          nullable: true
                          format: uri-reference
                          description: The URL to more information about the airport. Will be null for position-only flights.
                      required:
                      - code
                      - airport_info_url
                    waypoints:
                      type: array
                      items:
                        type: number
                      description: 'Route waypoints as an array of alternating latitudes and longitudes.

                        '
                    first_position_time:
                      type: string
                      nullable: true
                      format: date-time
                      description: Timestamp of when the first position for this flight was received.
                      example: '2021-12-31T19:59:59Z'
                    last_position:
                      type: object
                      description: Most recent position received for this flight.
                      title: FlightPosition
                      nullable: true
                      properties:
                        fa_flight_id:
                          type: string
                          nullable: true
                          description: 'Unique identifier assigned by FlightAware to the flight with this

                            position. This field is only populated by the `/flights/search/positions`

                            (in other cases, the user will have already specified the fa_flight_id).

                            '
                        altitude:
                          type: integer
                          description: Aircraft altitude in hundreds of feet
                        altitude_change:
                          type: string
                          nullable: false
                          description: 'C when the aircraft is climbing, D when descending, and - when the

                            altitude is being maintained.

                            '
                          enum:
                          - C
                          - D
                          - '-'
                        groundspeed:
                          type: integer
                          description: Most recent groundspeed (knots)
                        heading:
                          type: integer
                          nullable: true
                          description: Aircraft heading in degrees (0-360)
                          minimum: 0
                          maximum: 360
                        latitude:
                          type: number
                          description: Most recent latitude position
                        longitude:
                          type: number
                          description: Most recent longitude position
                        timestamp:
                          type: string
                          format: date-time
                          description: Time that position was received
                          example: '2021-12-31T19:59:59Z'
                        update_type:
                          type: string
                          nullable: true
                          description: 'P=projected, O=oceanic, Z=radar, A=ADS-B, M=multilateration,

                            D=datalink, X=surface and near surface (ADS-B and ASDE-X),

                            S=space-based

                            '
                          enum:
                          - P
                          - O
                          - Z
                          - A
                          - M
                          - D
                          - X
                          - S
                          - null
                      required:
                      - fa_flight_id
                      - altitude
                      - altitude_change
                      - groundspeed
                      - heading
                      - latitude
                      - longitude
                      - timestamp
                      - update_type
                    bounding_box:
                      type: array
                      nullable: true
                      description: 'List of 4 coordinates representing the edges of a box that entirely

                        contains this flight''s positions. The order of the coordinates are the

                        top, left, bottom, and right sides of the box.

                        '
                      maxItems: 4
                      minItems: 4
                      items:
                        type: number
                    ident_prefix:
                      type: string
                      nullable: true
                      description: 'A one or two character identifier prefix code (Common values: G or GG

                        Medevac, L Lifeguard, A Air Taxi, H Heavy, M Medium).

                        '
                    aircraft_type:
                      type: string
                      nullable: true
                      description: 'Aircraft type will generally be ICAO code, but IATA code will be given

                        when the ICAO code is not known.

                        '
                    actual_off:
                      type: string
                      format: date-time
                      nullable: true
                      description: 'Actual runway departure time.

                        '
                      example: '2021-12-31T19:59:59Z'
                    actual_on:
                      type: string
                      format: date-time
                      nullable: true
                      description: 'Actual runway arrival time.

                        '
                      example: '2021-12-31T19:59:59Z'
                  required:
                  - ident
                  - fa_flight_id
                  - actual_off
                  - actual_on
                  - origin
                  - destination
                  - waypoints
                  - first_position_time
                  - last_position
                  - bounding_box
                  - ident_prefix
                  - aircraft_type
                - title: ForesightPredictionsAvailable
                  type: object
                  properties:
                    foresight_predictions_available:
                      type: boolean
                      description: Indicates if Foresight predictions are available for AeroAPI /foresight endpoints.
                      example: true
                  required:
                  - foresight_predictions_available
                - title: ForesightLegacyDummy
                  type: object
                  properties:
                    predicted_out:
                      type: string
                      format: date-time
                      nullable: true
                      description: Predicted time of gate departure event. Only available from /foresight endpoints.
                      example: null
                    predicted_off:
                      type: string
                      format: date-time
                      nullable: true
                      description: Predicted time of runway departure event. Only available from /foresight endpoints.
                      example: null
                    predicted_on:
                      type: string
                      format: date-time
                      nullable: true
                      description: Predicted time of runway arrival event. Only available from /foresight endpoints.
                      example: null
                    predicted_in:
                      type: string
                      format: date-time
                      nullable: true
                      description: Predicted time of gate arrival event. Only available from /foresight endpoints.
                      example: null
                    predicted_out_source:
                      type: string
                      nullable: true
                      description: Source indicator of the predicted time of the gate departure event. Only available from /foresight endpoints.
                      enum:
                      - null
                      - Foresight
                      - Historical Average
                    predicted_off_source:
                      type: string
                      nullable: true
                      description: Source indicator of the predicted time of the runway departure event. Only available from /foresight endpoints.
                      enum:
                      - null
                      - Foresight
                      - Historical Average
                    predicted_on_source:
                      type: string
                      nullable: true
                      description: Source indicator of the predicted time of the runway arrival event. Only available from /foresight endpoints.
                      enum:
                      - null
                      - Foresight
                      - Historical Average
                    predicted_in_source:
                      type: string
                      nullable: true
                      description: Source indicator of the predicted time of the gate arrival event. Only available from /foresight endpoints.
                      enum:
                      - null
                      - Foresight
                      - Historical Average
                  required:
                  - predicted_out
                  - predicted_off
                  - predicted_on
                  - predicted_in
                  - predicted_out_source
                  - predicted_off_source
                  - predicted_on_source
                  - predicted_in_source
        '400':
          description: 'Incorrect parameter (id). Id may be missing or may not be fa_flight_id format.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /flights/{id}/track:
    get:
      operationId: get_flight_track
      summary: Get Flight's Track
      description: 'Returns the track for a flight as an array of positions.

        Data from up to 10 days ago can be obtained. If looking for older data,

        please use the corresponding historical endpoint.

        '
      tags:
      - flights
      parameters:
      - name: id
        in: path
        description: 'The fa_flight_id to fetch. If looking for data from more than 10 days ago,

          please use the corresponding historical endpoint.

          '
        required: true
        schema:
          type: string
        examples:
          fa_id:
            value: UAL1234-1234567890-airline-0123
      - name: include_estimated_positions
        in: query
        description: Whether to include estimated positions in the flight track
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                properties:
                  positions:
                    type: array
                    items:
                      title: FlightPosition
                      type: object
                      nullable: true
                      properties:
                        fa_flight_id:
                          type: string
                          nullable: true
                          description: 'Unique identifier assigned by FlightAware to the flight with this

                            position. This field is only populated by the `/flights/search/positions`

                            (in other cases, the user will have already specified the fa_flight_id).

                            '
                        altitude:
                          type: integer
                          description: Aircraft altitude in hundreds of feet
                        altitude_change:
                          type: string
                          nullable: false
                          description: 'C when the aircraft is climbing, D when descending, and - when the

                            altitude is being maintained.

                            '
                          enum:
                          - C
                          - D
                          - '-'
                        groundspeed:
                          type: integer
                          description: Most recent groundspeed (knots)
                        heading:
                          type: integer
                          nullable: true
                          description: Aircraft heading in degrees (0-360)
                          minimum: 0
                          maximum: 360
                        latitude:
                          type: number
                          description: Most recent latitude position
                        longitude:
                          type: number
                          description: Most recent longitude position
                        timestamp:
                          type: string
                          format: date-time
                          description: Time that position was received
                          example: '2021-12-31T19:59:59Z'
                        update_type:
                          type: string
                          nullable: true
                          description: 'P=projected, O=oceanic, Z=radar, A=ADS-B, M=multilateration,

                            D=datalink, X=surface and near surface (ADS-B and ASDE-X),

                            S=space-based

                            '
                          enum:
                          - P
                          - O
                          - Z
                          - A
                          - M
                          - D
                          - X
                          - S
                          - null
                      required:
                      - fa_flight_id
                      - altitude
                      - altitude_change
                      - groundspeed
                      - heading
                      - latitude
                      - longitude
                      - timestamp
                      - update_type
        '400':
          description: 'Incorrect parameter(s). Id may be missing or may not be fa_flight_id format. Aircraft may be blocked.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
        '404':
          description: 'No track is available for this flight.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /flights/{id}/route:
    get:
      operationId: get_flight_route
      summary: Get Flight's Filed Route
      description: 'Returns information about a flight''s filed route including coordinates,

        names, and types of fixes along the route.  Not all flight routes can

        be successfully decoded by this endpoint, particularly if the flight is

        not entirely within the continental U.S. airspace, since this function

        only has access to navaids within that area. If data on a waypoint is

        missing then the type will be listed as "UNKNOWN". Data from up to 10 days

        ago can be obtained. If looking for older data, please use the corresponding

        historical endpoint.

        '
      tags:
      - flights
      parameters:
      - name: id
        in: path
        description: 'The fa_flight_id to fetch. If looking for data from more than 10 days ago,

          please use the corresponding historical endpoint.

          '
        required: true
        schema:
          type: string
        examples:
          fa_id:
            value: UAL1234-1234567890-airline-0123
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                properties:
                  route_distance:
                    nullable: true
                    type: string
                  fixes:
                    type: array
                    items:
                      title: RouteFix
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the route fix
                        latitude:
                          type: number
                          nullable: true
                          description: Longitude of the fix in decimal degrees
                        longitude:
                          type: number
                          nullable: true
                          description: Longitude of the fix in decimal degrees
                        distance_from_origin:
                          type: number
                          nullable: true
                          description: 'Distance from origin airport stated in statue miles, nautical miles or

                            kilometers depending on FlightAware Account Display Options

                            '
                        distance_this_leg:
                          type: number
                          nullable: true
                          description: 'Distance from the last point on Route stated in statue miles, nautical

                            miles or kilometers depending on FlightAware Account Display Options

                            '
                        distance_to_destination:
                          type: number
                          nullable: true
                          description: 'Distance to destination airport stated in statue miles, nautical miles or

                            kilometers depending on FlightAware Account Display Options

                            '
                        outbound_course:
                          type: number
                          nullable: true
                          description: 'Course in integer degrees from the current point to the next relative to true north

                            '
                        type:
                          type: string
                          description: Type of the fix (ie Waypoint / Reporting Point)
                      required:
                      - name
                      - latitude
                      - longitude
                      - distance_from_origin
                      - distance_this_leg
                      - distance_to_destination
                      - outbound_course
                      - type
                required:
                - route_distance
                - fixes
        '400':
          description: 'Incorrect parameter (id). Id may be missing or may not be fa_flight_id format.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
        '404':
          description: 'No route is available for this flight.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /flights/{id}/map:
    get:
      operationId: get_flight_map
      summary: Get an Image of a Flight's Track on a Map
      description: 'Returns a flight''s track as a base64-encoded image. Image can contain a

        variety of additional data layers beyond just the track. Data from up to 10 days

        ago can be obtained. If looking for older data, please use the corresponding

        historical endpoint.

        '
      tags:
      - flights
      parameters:
      - name: id
        in: path
        description: 'The fa_flight_id to fetch. If looking for data from more than 10 days ago,

          please use the corresponding historical endpoint.

          '
        required: true
        schema:
          type: string
        examples:
          fa_id:
            value: UAL1234-1234567890-airline-0123
      - name: height
        in: query
        description: Height of requested image (pixels)
        schema:
          type: integer
          minimum: 1
          maximum: 1500
          default: 480
      - name: width
        in: query
        description: Width of requested image (pixels)
        schema:
          type: integer
          minimum: 1
          maximum: 1500
          default: 640
      - name: layer_on
        in: query
        description: List of map layers to enable
        schema:
          type: array
          items:
            type: string
            enum:
            - US Cities
            - european country boundaries
            - asia country boundaries
            - major airports
            - country boundaries
            - US state boundaries
            - water
            - US major roads
            - radar
            - track
            - flights
            - airports
          default:
          - country boundaries
          - US state boundaries
          - water
          - US major roads
          - radar
          - track
          - flights
          - airports
      - name: layer_off
        in: query
        description: List of map layers to disable
        schema:
          type: array
          items:
            type: string
            enum:
            - US Cities
            - european country boundaries
            - asia country boundaries
            - major airports
            - country boundaries
            - US state boundaries
            - water
            - US major roads
            - radar
            - track
            - flights
            - airports
          default:
          - US Cities
          - european country boundaries
          - asia country boundaries
          - major airports
      - name: show_data_block
        in: query
        description: 'Whether a textual caption containing the ident, type, heading,

          altitude, origin, and destination should be displayed by the flight''s

          position.

          '
        schema:
          type: boolean
          default: false
      - name: airports_expand_view
        in: query
        description: 'Whether to force zoom area to ensure origin/destination airports are

          visible. Enabling this flag forcefully enables the show_airports flag

          as well.

          '
        schema:
          type: boolean
          default: false
      - name: show_airports
        in: query
        description: 'Whether to show the origin/destination airports for the flight as

          labeled points on the map.

          '
        schema:
          type: boolean
          default: false
      - name: bounding_box
        in: query
        description: 'Manually specify the zoom area of the map using custom bounds. Should

          be a list of 4 coordinates representing the top, right, bottom, and

          left sides of the area (in that order).

          '
        schema:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                properties:
                  map:
                    type: string
                    format: byte
                required:
                - map
        '400':
          description: 'Incorrect parameter (id). Id may be missing or may not be fa_flight_id format. Bounding box corners may be incorrectly defined.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-apikey
      description: 'Unlike previous versions of AeroAPI, authentication is now controlled by

        an API key that must be set in the header ```x-apikey```. Your

        FlightAware username is not used when authenticating to the API.

        '
