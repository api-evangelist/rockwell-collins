openapi: 3.2.0
info:
  title: Aero History API
  version: 4.17.1
  description: '# Introduction

    AeroAPI is a simple, query-based API that gives software developers access

    to a variety of FlightAware''s flight data.'
servers:
- url: https://{env}.flightaware.com/aeroapi
  variables:
    env:
      default: aeroapi
      enum:
      - aeroapi
security:
- ApiKeyAuth: []
tags:
- name: History
paths:
  /history/flights/{ident}:
    get:
      operationId: get_history_flight
      summary: Get Information for a Historical Flight
      description: 'Returns historical flight info status summary for a registration, ident,

        or fa_flight_id. If a fa_flight_id is specified then a maximum of 1

        flight is returned, unless the flight has been diverted in which case

        both the original flight and any diversions will be returned with a

        duplicate fa_flight_id. If a registraion or ident is specified then a

        start_date and end_date must be specified. The span between start_date

        and end_date can be up to 7 days. No more than 40 pages may be requested

        at once. Data is available from now back to 2011-01-01 00:00:00 UTC.


        The field `inbound_fa_flight_id` will not be populated by this resource.'
      tags:
      - History
      parameters:
      - name: ident
        in: path
        description: 'The ident, registration, or fa_flight_id to fetch. If using

          a flight ident, it is highly recommended to specify ICAO flight

          ident rather than IATA flight ident to avoid ambiguity and unexpected results.

          Setting the ident_type can also be used to help disambiguate.

          '
        required: true
        schema:
          type: string
        examples:
          ident:
            value: UAL4
          reg:
            value: N123HQ
          fa_id:
            value: UAL1234-1234567890-airline-0123
      - name: ident_type
        in: query
        description: 'Type of ident provided in the ident parameter. By default, the passed

          ident is interpreted as a registration if possible. This parameter can

          force the ident to be interpreted as a designator instead.

          '
        schema:
          type: string
          enum:
          - designator
          - registration
          - fa_flight_id
      - name: start
        in: query
        description: 'The starting date range for flight results, comparing against flights''

          `scheduled_out` field (or `scheduled_off` if `scheduled_out` is

          missing). The format is ISO8601 date or datetime, and the bound is

          inclusive. Specified start date must occur on or after 2011-01-01 00:00:00 UTC

          and cannot be in the future. If using date instead of datetime, the

          time will default to 00:00:00Z.

          '
        schema:
          type: string
          oneOf:
          - format: date-time
          - format: date
        examples:
          datetime:
            value: '2021-12-31T19:59:59Z'
          date:
            value: '2021-12-31'
      - name: end
        in: query
        description: 'The ending date range for flight results, comparing against flights''

          `scheduled_out` field (or `scheduled_off` if `scheduled_out` is

          missing). The format is ISO8601 date or datetime, and the bound is

          exclusive. Specified end date must occur after 2011-01-01 00:00:00 UTC

          and cannot be in the future. If using date instead of datetime, the

          time will default to 00:00:00Z.

          '
        schema:
          type: string
          oneOf:
          - format: date-time
          - format: date
        examples:
          datetime:
            value: '2021-12-31T19:59:59Z'
          date:
            value: '2021-12-31'
      - in: query
        name: max_pages
        description: Maximum number of pages to fetch. This is an upper limit and not a guarantee of how many pages will be returned.
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: cursor
        description: 'Opaque value used to get the next batch of data from a paged collection.

          '
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                properties:
                  links:
                    type:
                    - object
                    - 'null'
                    description: 'Object containing links to related resources.

                      '
                    properties:
                      next:
                        type: string
                        format: uri-reference
                        description: 'A link to the next set of records in a collection.

                          '
                    required:
                    - next
                  num_pages:
                    description: Number of pages returned
                    type: integer
                    minimum: 1
                  flights:
                    type: array
                    items:
                      allOf:
                      - title: BaseFlight
                        type: object
                        properties:
                          ident:
                            type: string
                            description: 'Either the operator code followed by the flight number for the flight

                              (for commercial flights) or the aircraft''s registration (for general

                              aviation).

                              '
                          ident_icao:
                            type:
                            - string
                            - 'null'
                            description: 'The ICAO operator code followed by the flight number for the flight (for commercial flights)

                              '
                          ident_iata:
                            type:
                            - string
                            - 'null'
                            description: 'The IATA operator code followed by the flight number for the flight (for commercial flights)

                              '
                          actual_runway_off:
                            type:
                            - string
                            - 'null'
                            description: 'Actual departure runway at origin, when known

                              '
                          actual_runway_on:
                            type:
                            - string
                            - 'null'
                            description: 'Actual arrival runway at destination, when known

                              '
                          fa_flight_id:
                            type: string
                            description: 'Unique identifier assigned by FlightAware for this specific flight. If

                              the flight is diverted, the new leg of the flight will have a duplicate

                              fa_flight_id.

                              '
                          operator:
                            type:
                            - string
                            - 'null'
                            description: 'ICAO code, if exists, of the operator of the flight, otherwise the IATA code

                              '
                          operator_icao:
                            type:
                            - string
                            - 'null'
                            description: 'ICAO code of the operator of the flight.

                              '
                          operator_iata:
                            type:
                            - string
                            - 'null'
                            description: 'IATA code of the operator of the flight.

                              '
                          flight_number:
                            type:
                            - string
                            - 'null'
                            description: 'Bare flight number of the flight.

                              '
                          registration:
                            type:
                            - string
                            - 'null'
                            description: 'Aircraft registration (tail number) of the aircraft, when known.

                              '
                          atc_ident:
                            type:
                            - string
                            - 'null'
                            description: 'The ident of the flight for Air Traffic Control purposes, when known and different than ident.

                              '
                          inbound_fa_flight_id:
                            type:
                            - string
                            - 'null'
                            description: 'Unique identifier assigned by FlightAware for the previous flight of the

                              aircraft serving this flight.

                              '
                          codeshares:
                            type:
                            - array
                            - 'null'
                            description: 'List of any ICAO codeshares operating on this flight.

                              '
                            items:
                              type: string
                          codeshares_iata:
                            type:
                            - array
                            - 'null'
                            description: 'List of any IATA codeshares operating on this flight.

                              '
                            items:
                              type: string
                          blocked:
                            type: boolean
                            description: 'Flag indicating whether this flight is blocked from public viewing.

                              '
                          diverted:
                            type: boolean
                            description: 'Flag indicating whether this flight was diverted.

                              '
                          cancelled:
                            type: boolean
                            description: 'Flag indicating that the flight is no longer being tracked by

                              FlightAware. There are a number of reasons this could happen

                              including cancellation by the airline, but that will not always be the

                              case.

                              '
                          position_only:
                            type: boolean
                            description: 'Flag indicating that this flight does not have a flight plan, schedule, or other indication of intent available.

                              '
                          origin:
                            description: 'Information for this flight''s origin airport.

                              '
                            title: FlightAirportRef
                            type:
                            - object
                            - 'null'
                            properties:
                              code:
                                type:
                                - string
                                - 'null'
                                description: 'ICAO/IATA/LID code or string indicating the location where

                                  tracking of the flight began/ended for position-only flights.

                                  '
                              code_icao:
                                type:
                                - string
                                - 'null'
                                description: 'ICAO code

                                  '
                              code_iata:
                                type:
                                - string
                                - 'null'
                                description: 'IATA code

                                  '
                              code_lid:
                                type:
                                - string
                                - 'null'
                                description: 'LID code

                                  '
                              timezone:
                                type:
                                - string
                                - 'null'
                                description: 'Applicable timezone for the airport, in the TZ database format

                                  '
                                example: America/New_York
                              name:
                                type:
                                - string
                                - 'null'
                                description: 'Common name of airport

                                  '
                                example: LaGuardia
                              city:
                                type:
                                - string
                                - 'null'
                                description: 'Closest city to the airport

                                  '
                                example: New York
                              airport_info_url:
                                type:
                                - string
                                - 'null'
                                format: uri-reference
                                description: The URL to more information about the airport. Will be null for position-only flights.
                            required:
                            - code
                            - airport_info_url
                          destination:
                            description: 'Information for this flight''s destination airport.

                              '
                            title: FlightAirportRef
                            type:
                            - object
                            - 'null'
                            properties:
                              code:
                                type:
                                - string
                                - 'null'
                                description: 'ICAO/IATA/LID code or string indicating the location where

                                  tracking of the flight began/ended for position-only flights.

                                  '
                              code_icao:
                                type:
                                - string
                                - 'null'
                                description: 'ICAO code

                                  '
                              code_iata:
                                type:
                                - string
                                - 'null'
                                description: 'IATA code

                                  '
                              code_lid:
                                type:
                                - string
                                - 'null'
                                description: 'LID code

                                  '
                              timezone:
                                type:
                                - string
                                - 'null'
                                description: 'Applicable timezone for the airport, in the TZ database format

                                  '
                                example: America/New_York
                              name:
                                type:
                                - string
                                - 'null'
                                description: 'Common name of airport

                                  '
                                example: LaGuardia
                              city:
                                type:
                                - string
                                - 'null'
                                description: 'Closest city to the airport

                                  '
                                example: New York
                              airport_info_url:
                                type:
                                - string
                                - 'null'
                                format: uri-reference
                                description: The URL to more information about the airport. Will be null for position-only flights.
                            required:
                            - code
                            - airport_info_url
                          departure_delay:
                            type:
                            - integer
                            - 'null'
                            description: 'Departure delay (in seconds) based on either actual or estimated gate

                              departure time. If gate time is unavailable then based on runway departure

                              time. A negative value indicates the flight is early.

                              '
                          arrival_delay:
                            type:
                            - integer
                            - 'null'
                            description: 'Arrival delay (in seconds) based on either actual or estimated gate

                              arrival time. If gate time is unavailable then based on runway arrival

                              time. A negative value indicates the flight is early.

                              '
                          filed_ete:
                            type:
                            - integer
                            - 'null'
                            description: 'Runway-to-runway filed duration (seconds).

                              '
                          progress_percent:
                            type:
                            - integer
                            - 'null'
                            description: 'The percent completion of a flight, based on runway departure/arrival. Null

                              for en route position-only flights.

                              '
                            minimum: 0
                            maximum: 100
                          status:
                            type: string
                            description: 'Human-readable summary of flight status.

                              '
                          aircraft_type:
                            type:
                            - string
                            - 'null'
                            description: 'Aircraft type will generally be ICAO code, but IATA code will be given

                              when the ICAO code is not known.

                              '
                          route_distance:
                            type:
                            - integer
                            - 'null'
                            description: 'Planned flight distance (statute miles) based on the filed route. May

                              vary from actual flown distance.

                              '
                          filed_airspeed:
                            type:
                            - integer
                            - 'null'
                            description: 'Filed IFR airspeed (knots).

                              '
                          filed_altitude:
                            type:
                            - integer
                            - 'null'
                            description: 'Filed IFR altitude (100s of feet).

                              '
                          route:
                            type:
                            - string
                            - 'null'
                            description: 'The textual description of the flight''s route.

                              '
                          baggage_claim:
                            type:
                            - string
                            - 'null'
                            description: 'Baggage claim location at the destination airport.

                              '
                          seats_cabin_business:
                            type:
                            - integer
                            - 'null'
                            description: 'Number of seats in the business class cabin.

                              '
                          seats_cabin_coach:
                            type:
                            - integer
                            - 'null'
                            description: 'Number of seats in the coach cabin.

                              '
                          seats_cabin_first:
                            type:
                            - integer
                            - 'null'
                            description: 'Number of seats in the first class cabin.

                              '
                          gate_origin:
                            type:
                            - string
                            - 'null'
                            description: 'Departure gate at the origin airport.

                              '
                          gate_destination:
                            type:
                            - string
                            - 'null'
                            description: 'Arrival gate at the destination airport.

                              '
                          terminal_origin:
                            type:
                            - string
                            - 'null'
                            description: 'Departure terminal at the origin airport.

                              '
                          terminal_destination:
                            type:
                            - string
                            - 'null'
                            description: 'Arrival terminal at the destination airport.

                              '
                          type:
                            type: string
                            description: 'Whether this is a commercial or general aviation flight.

                              '
                            enum:
                            - General_Aviation
                            - Airline
                          scheduled_out:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Scheduled gate departure time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          estimated_out:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Estimated gate departure time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          actual_out:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Actual gate departure time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          scheduled_off:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Scheduled runway departure time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          estimated_off:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Estimated runway departure time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          actual_off:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Actual runway departure time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          scheduled_on:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Scheduled runway arrival time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          estimated_on:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Estimated runway arrival time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          actual_on:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Actual runway arrival time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          scheduled_in:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Scheduled gate arrival time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          estimated_in:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Estimated gate arrival time.

                              '
                            example: '2021-12-31T19:59:59Z'
                          actual_in:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: 'Actual gate arrival time.

                              '
                            example: '2021-12-31T19:59:59Z'
                        required:
                        - ident
                        - fa_flight_id
                        - operator
                        - operator_iata
                        - flight_number
                        - registration
                        - atc_ident
                        - inbound_fa_flight_id
                        - codeshares
                        - blocked
                        - diverted
                        - cancelled
                        - position_only
                        - origin
                        - destination
                        - departure_delay
                        - arrival_delay
                        - filed_ete
                        - progress_percent
                        - status
                        - aircraft_type
                        - route_distance
                        - filed_airspeed
                        - filed_altitude
                        - route
                        - baggage_claim
                        - seats_cabin_business
                        - seats_cabin_coach
                        - seats_cabin_first
                        - gate_origin
                        - gate_destination
                        - terminal_origin
                        - terminal_destination
                        - type
                        - scheduled_out
                        - estimated_out
                        - actual_out
                        - scheduled_off
                        - estimated_off
                        - actual_off
                        - scheduled_on
                        - estimated_on
                        - actual_on
                        - scheduled_in
                        - estimated_in
                        - actual_in
                      - title: ForesightPredictionsAvailable
                        type: object
                        properties:
                          foresight_predictions_available:
                            type: boolean
                            description: Indicates if Foresight predictions are available for AeroAPI /foresight endpoints.
                            example: true
                        required:
                        - foresight_predictions_available
                required:
                - links
                - num_pages
                - flights
        '400':
          description: 'Incorrect parameter(s). Ident may be missing or not in fa_flight_id format or max_pages may be < 1. Request may be for data before earliest date or more than a 7 day span of results was requested.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /history/flights/{id}/track:
    get:
      operationId: get_history_flight_track
      summary: Get Historical Information for a Flight's Track
      description: 'Returns the track for a historical flight as an array of positions.

        Data is available from now back to 2011-01-01T00:00:00Z.'
      tags:
      - History
      parameters:
      - name: id
        in: path
        description: The fa_flight_id to fetch
        required: true
        schema:
          type: string
        examples:
          fa_id:
            value: UAL1234-1234567890-airline-0123
      - name: include_estimated_positions
        in: query
        description: Whether to include estimated positions in the flight track
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                properties:
                  positions:
                    type: array
                    items:
                      title: FlightPosition
                      type:
                      - object
                      - 'null'
                      properties:
                        fa_flight_id:
                          type:
                          - string
                          - 'null'
                          description: 'Unique identifier assigned by FlightAware to the flight with this

                            position. This field is only populated by the `/flights/search/positions`

                            (in other cases, the user will have already specified the fa_flight_id).

                            '
                        altitude:
                          type: integer
                          description: Aircraft altitude in hundreds of feet
                        altitude_change:
                          type: string
                          description: 'C when the aircraft is climbing, D when descending, and - when the

                            altitude is being maintained.

                            '
                          enum:
                          - C
                          - D
                          - '-'
                        groundspeed:
                          type: integer
                          description: Most recent groundspeed (knots)
                        heading:
                          type:
                          - integer
                          - 'null'
                          description: Aircraft heading in degrees (0-360)
                          minimum: 0
                          maximum: 360
                        latitude:
                          type: number
                          description: Most recent latitude position
                        longitude:
                          type: number
                          description: Most recent longitude position
                        timestamp:
                          type: string
                          format: date-time
                          description: Time that position was received
                          example: '2021-12-31T19:59:59Z'
                        update_type:
                          type:
                          - string
                          - 'null'
                          description: 'P=projected, O=oceanic, Z=radar, A=ADS-B, M=multilateration,

                            D=datalink, X=surface and near surface (ADS-B and ASDE-X),

                            S=space-based

                            '
                          enum:
                          - P
                          - O
                          - Z
                          - A
                          - M
                          - D
                          - X
                          - S
                          - null
                      required:
                      - fa_flight_id
                      - altitude
                      - altitude_change
                      - groundspeed
                      - heading
                      - latitude
                      - longitude
                      - timestamp
                      - update_type
        '400':
          description: 'Incorrect parameter(s). Id parameter may not be fa_flight_id format.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /history/flights/{id}/map:
    get:
      operationId: get_history_flight_map
      summary: Get an Image of a Historical Flight's Track on a Map
      description: 'Returns a historical flight''s track as a base64-encoded image. Image can contain a

        variety of additional data layers beyond just the track. Data is available from now back to

        2011-01-01T00:00:00Z.'
      tags:
      - History
      parameters:
      - name: id
        in: path
        description: The fa_flight_id to fetch
        required: true
        schema:
          type: string
        examples:
          fa_id:
            value: UAL1234-1234567890-airline-0123
      - name: height
        in: query
        description: Height of requested image (pixels)
        schema:
          type: integer
          minimum: 1
          maximum: 1500
          default: 480
      - name: width
        in: query
        description: Width of requested image (pixels)
        schema:
          type: integer
          minimum: 1
          maximum: 1500
          default: 640
      - name: layer_on
        in: query
        description: List of map layers to enable
        schema:
          type: array
          items:
            type: string
            enum:
            - US Cities
            - european country boundaries
            - asia country boundaries
            - major airports
            - country boundaries
            - US state boundaries
            - water
            - US major roads
            - radar
            - track
            - flights
            - airports
          default:
          - country boundaries
          - US state boundaries
          - water
          - US major roads
          - radar
          - track
          - flights
          - airports
      - name: layer_off
        in: query
        description: List of map layers to disable
        schema:
          type: array
          items:
            type: string
            enum:
            - US Cities
            - european country boundaries
            - asia country boundaries
            - major airports
            - country boundaries
            - US state boundaries
            - water
            - US major roads
            - radar
            - track
            - flights
            - airports
          default:
          - US Cities
          - european country boundaries
          - asia country boundaries
          - major airports
      - name: show_data_block
        in: query
        description: 'Whether a textual caption containing the ident, type, heading,

          altitude, origin, and destination should be displayed by the flight''s

          position.

          '
        schema:
          type: boolean
          default: false
      - name: airports_expand_view
        in: query
        description: 'Whether to force zoom area to ensure origin/destination airports are

          visible. Enabling this flag forcefully enables the show_airports flag

          as well.

          '
        schema:
          type: boolean
          default: false
      - name: show_airports
        in: query
        description: 'Whether to show the origin/destination airports for the flight as

          labeled points on the map.

          '
        schema:
          type: boolean
          default: false
      - name: bounding_box
        in: query
        description: 'Manually specify the zoom area of the map using custom bounds. Should

          be a list of 4 coordinates representing the top, right, bottom, and

          left sides of the area (in that order).

          '
        schema:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                properties:
                  map:
                    type: string
                    format: byte
                required:
                - map
        '400':
          description: 'Incorrect parameter (id). Id may be missing or may not be fa_flight_id format. Bounding box corners may be incorrectly defined.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /history/flights/{id}/route:
    get:
      operationId: get_history_flight_route
      summary: Get Historical Flight's Filed Route
      description: 'Returns information about a historical flight''s filed route including

        coordinates, names, and types of fixes along the route. Not all flight

        routes can be successfully decoded by this endpoint, particularly if the

        flight is not entirely within the continental U.S. airspace, since this function

        only has access to navaids within that area. If data on a waypoint is

        missing then the type will be listed as "UNKNOWN". Data is available from now back to

        2011-01-01T00:00:00Z.'
      tags:
      - History
      parameters:
      - name: id
        in: path
        description: The fa_flight_id to fetch
        required: true
        schema:
          type: string
        examples:
          fa_id:
            value: UAL1234-1234567890-airline-0123
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                properties:
                  route_distance:
                    type:
                    - string
                    - 'null'
                  fixes:
                    type: array
                    items:
                      title: RouteFix
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the route fix
                        latitude:
                          type:
                          - number
                          - 'null'
                          description: Longitude of the fix in decimal degrees
                        longitude:
                          type:
                          - number
                          - 'null'
                          description: Longitude of the fix in decimal degrees
                        distance_from_origin:
                          type:
                          - number
                          - 'null'
                          description: 'Distance from origin airport stated in statue miles, nautical miles or

                            kilometers depending on FlightAware Account Display Options

                            '
                        distance_this_leg:
                          type:
                          - number
                          - 'null'
                          description: 'Distance from the last point on Route stated in statue miles, nautical

                            miles or kilometers depending on FlightAware Account Display Options

                            '
                        distance_to_destination:
                          type:
                          - number
                          - 'null'
                          description: 'Distance to destination airport stated in statue miles, nautical miles or

                            kilometers depending on FlightAware Account Display Options

                            '
                        outbound_course:
                          type:
                          - number
                          - 'null'
                          description: 'Course in integer degrees from the current point to the next relative to true north

                            '
                        type:
                          type: string
                          description: Type of the fix (ie Waypoint / Reporting Point)
                      required:
                      - name
                      - latitude
                      - longitude
                      - distance_from_origin
                      - distance_this_leg
                      - distance_to_destination
                      - outbound_course
                      - type
                required:
                - route_distance
                - fixes
        '400':
          description: 'Incorrect parameter(s). Id parameter may not be fa_flight_id format.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /history/aircraft/{registration}/last_flight:
    get:
      operationId: get_history_aircraft_last_flight
      summary: Get Aircraft's Last Known Flight
      description: 'Returns flight info status summary for an aircraft''s last known flight

        given its registration. The search is limited to flights flown since

        January 1, 2011. On a successful response, the body will contain a

        flights array with only 1 element. If a user queries a registration with

        it''s last known flight before January 1, 2011, an empty flights array will

        be returned.'
      tags:
      - History
      parameters:
      - name: registration
        in: path
        description: The registration number of the aircraft to fetch
        required: true
        schema:
          type: string
        examples:
          registration:
            value: N199UA
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                properties:
                  flights:
                    type: array
                    items:
                      title: BaseFlight
                      type: object
                      properties:
                        ident:
                          type: string
                          description: 'Either the operator code followed by the flight number for the flight

                            (for commercial flights) or the aircraft''s registration (for general

                            aviation).

                            '
                        ident_icao:
                          type:
                          - string
                          - 'null'
                          description: 'The ICAO operator code followed by the flight number for the flight (for commercial flights)

                            '
                        ident_iata:
                          type:
                          - string
                          - 'null'
                          description: 'The IATA operator code followed by the flight number for the flight (for commercial flights)

                            '
                        actual_runway_off:
                          type:
                          - string
                          - 'null'
                          description: 'Actual departure runway at origin, when known

                            '
                        actual_runway_on:
                          type:
                          - string
                          - 'null'
                          description: 'Actual arrival runway at destination, when known

                            '
                        fa_flight_id:
                          type: string
                          description: 'Unique identifier assigned by FlightAware for this specific flight. If

                            the flight is diverted, the new leg of the flight will have a duplicate

                            fa_flight_id.

                            '
                        operator:
                          type:
                          - string
                          - 'null'
                          description: 'ICAO code, if exists, of the operator of the flight, otherwise the IATA code

                            '
                        operator_icao:
                          type:
                          - string
                          - 'null'
                          description: 'ICAO code of the operator of the flight.

                            '
                        operator_iata:
                          type:
                          - string
                          - 'null'
                          description: 'IATA code of the operator of the flight.

                            '
                        flight_number:
                          type:
                          - string
                          - 'null'
                          description: 'Bare flight number of the flight.

                            '
                        registration:
                          type:
                          - string
                          - 'null'
                          description: 'Aircraft registration (tail number) of the aircraft, when known.

                            '
                        atc_ident:
                          type:
                          - string
                          - 'null'
                          description: 'The ident of the flight for Air Traffic Control purposes, when known and different than ident.

                            '
                        inbound_fa_flight_id:
                          type:
                          - string
                          - 'null'
                          description: 'Unique identifier assigned by FlightAware for the previous flight of the

                            aircraft serving this flight.

                            '
                        codeshares:
                          type:
                          - array
                          - 'null'
                          description: 'List of any ICAO codeshares operating on this flight.

                            '
                          items:
                            type: string
                        codeshares_iata:
                          type:
                          - array
                          - 'null'
                          description: 'List of any IATA codeshares operating on this flight.

                            '
                          items:
                            type: string
                        blocked:
                          type: boolean
                          description: 'Flag indicating whether this flight is blocked from public viewing.

                            '
                        diverted:
                          type: boolean
                          description: 'Flag indicating whether this flight was diverted.

                            '
                        cancelled:
                          type: boolean
                          description: 'Flag indicating that the flight is no longer being tracked by

                            FlightAware. There are a number of reasons this could happen

