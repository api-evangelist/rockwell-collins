  /operators/{id}/flights/counts:
    parameters:
    - name: id
      in: path
      required: true
      description: 'The ICAO or IATA identifier for an operator. The use of ICAO code is

        strongly preferred. In the case of non-unique IATA codes the operator

        with the lexicographically first ICAO code will be returned.

        '
      schema:
        type: string
        example: UAL
    get:
      operationId: get_operator_flights_count
      summary: Get Flight Counts for Operator
      description: 'Returns counts of both airborne and recently operated flights for

        operator.

        '
      tags:
      - operators
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                title: OperatorFlightCounts
                type: object
                properties:
                  airborne:
                    type: integer
                    minimum: 0
                    description: The number of currently airborne flights for this operator.
                  flights_last_24_hours:
                    type: integer
                    minimum: 0
                    description: 'The number of flights departed in the last 24 hours for this operator,

                      including airborne flights.

                      '
                required:
                - airborne
                - flights_last_24_hours
        '400':
          description: Incorrect parameter (id). Id must be a valid operator code and cannot be empty.
          content:
