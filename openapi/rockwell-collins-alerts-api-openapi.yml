                              description: 'Arrival terminal at the destination airport.

                                '
                            error:
                              type: string
                              description: 'Will contain error information in the event that

                                a problem is encountered assembling the flight details

                                '
              responses:
                '200':
                  description: Your server returns this code if it accepts the callback
    delete:
      operationId: delete_alerts_endpoint
      summary: Remove and Disable Default Account-wide Alert Callback URL
      description: 'Remove the default account-wide URL that will be POSTed to for alerts that are

        not configured with a specific URL. This means that any alerts that are not configured

        with a specific URL will not be delivered.'
      tags:
      - Alerts
      responses:
        '204':
          description: Endpoint successfully removed.
        '400':
