  /airports/{id}/flights/to/{dest_id}:
    get:
      operationId: get_flights_between_airports
      summary: Get Flights with a Specific Origin and Destination
      description: 'This endpoint is quite similar to the `FindFlight` operator in prior

        versions of AeroAPI. Results may include both non-stop and one-stop

        flights. Note that because the returned flights can include multiple

        legs, the response format differs from most other flight-returning

        endpoints. If the optional start or end query parameters are not

        provided start will default to 1 day in the future, while end will

        default to 7 days in the past relative to the time the query is made.

        '
      tags:
      - airports
      parameters:
      - name: id
        in: path
        description: 'ICAO, IATA or LID ID of destination airport to fetch. [ICAO is highly preferred](/aeroapi/portal/resources#icaoCode) to prevent ambiguity.

          '
        required: true
        schema:
          type: string
        examples:
          ICAO:
            value: KIAH
          IATA:
            value: IAH
      - name: dest_id
        in: path
        description: 'ICAO, IATA or LID ID of destination airport to fetch. [ICAO is highly preferred](/aeroapi/portal/resources#icaoCode) to prevent ambiguity.

          '
        required: true
        schema:
          type: string
        examples:
          ICAO:
            value: KIAH
          IATA:
            value: IAH
      - name: type
        in: query
        description: Type of flights to return.
        schema:
          type: string
          enum:
          - General_Aviation
          - Airline
      - name: connection
        in: query
        description: 'Whether flights should be filtered based on their connection status. If setting

          start/end date parameters then connection must be set to nonstop, and will

          default to nonstop if left blank. If start/end are not specified then leaving

          this blank will result in a mix of nonstop and one-stop flights being returned,

          with a preference for nonstop flights. One-stop flights are identified with a

          custom heuristic, which may be incomplete.

          '
        schema:
          type: string
          enum:
          - nonstop
          - onestop
      - name: start
        in: query
        description: 'The starting date range for flight results. The format is ISO8601 date

          or datetime, and the bound is inclusive. Specified start date must be

          no further than 10 days in the past and 2 days in the future. If using

          date instead of datetime, the time will default to 00:00:00Z.

          '
        schema:
          type: string
          oneOf:
          - format: date-time
          - format: date
        examples:
          datetime:
            value: '2021-12-31T19:59:59Z'
          date:
            value: '2021-12-31'
        x-fill-example: 'no'
      - name: end
        in: query
        description: 'The ending date range for flight results. The format is ISO8601 date

          or datetime, and the bound is exclusive. Specified end date must be

          no further than 10 days in the past and 2 days in the future. If using

          date instead of datetime, the time will default to 00:00:00Z.

          '
        schema:
          type: string
          oneOf:
          - format: date-time
          - format: date
        examples:
          datetime:
            value: '2021-12-31T19:59:59Z'
          date:
            value: '2021-12-31'
        x-fill-example: 'no'
      - in: query
        name: max_pages
        description: Maximum number of pages to fetch. This is an upper limit and not a guarantee of how many pages will be returned.
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: cursor
        description: 'Opaque value used to get the next batch of data from a paged collection.

          '
        schema:
          type: string
      responses:
