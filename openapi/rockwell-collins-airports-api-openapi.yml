  /airports/{id}/flights/scheduled_arrivals:
    get:
      operationId: get_airport_flights_scheduled_arrivals
      summary: Get Future Flights Arriving at an Airport
      description: 'Returns flights that are expected to arrive at an airport. This can

        include both undeparted and en route flights. Flights are ordered by

        `estimated_on` ascending. The optional start and end parameters will

        be compared against `estimated_on` to limit the flights returned. The

        start parameter''s default value is 48 hours before the current time

        (this accounts for delayed flights). The end parameter''s default value

        is 24 hours after the current time.

        '
      tags:
      - airports
      parameters:
      - name: id
        in: path
        description: 'ICAO, IATA or LID ID of destination airport to fetch. [ICAO is highly preferred](/aeroapi/portal/resources#icaoCode) to prevent ambiguity.

          '
        required: true
        schema:
          type: string
        examples:
          ICAO:
            value: KIAH
          IATA:
            value: IAH
      - name: airline
        in: query
        description: Airline to filter flights by. Do not provide airline if type is provided.
        schema:
          type: string
          example: UAL
      - name: type
        in: query
        description: Type of flights to return. Do not provide type if airline is provided.
        schema:
          type: string
          enum:
          - General_Aviation
          - Airline
      - name: start
        in: query
        description: 'The starting date range for flight results. The format is ISO8601 date

          or datetime, and the bound is inclusive. Specified start date must be

          no further than 10 days in the past and 2 days in the future. If using

          date instead of datetime, the time will default to 00:00:00Z.

          '
        schema:
          type: string
          oneOf:
          - format: date-time
          - format: date
        examples:
          datetime:
            value: '2021-12-31T19:59:59Z'
          date:
            value: '2021-12-31'
        x-fill-example: 'no'
      - name: end
        in: query
        description: 'The ending date range for flight results. The format is ISO8601 date

          or datetime, and the bound is exclusive. Specified end date must be

          no further than 10 days in the past and 2 days in the future. If using

          date instead of datetime, the time will default to 00:00:00Z.

          '
        schema:
          type: string
          oneOf:
          - format: date-time
          - format: date
        examples:
          datetime:
            value: '2021-12-31T19:59:59Z'
          date:
            value: '2021-12-31'
        x-fill-example: 'no'
      - in: query
        name: max_pages
        description: Maximum number of pages to fetch. This is an upper limit and not a guarantee of how many pages will be returned.
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: cursor
        description: 'Opaque value used to get the next batch of data from a paged collection.

          '
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                type: object
                properties:
                  links:
                    type: object
                    nullable: true
                    description: 'Object containing links to related resources.

                      '
                    properties:
                      next:
                        type: string
                        format: uri-reference
                        description: 'A link to the next set of records in a collection.

                          '
                    required:
                    - next
                  num_pages:
                    description: Number of pages returned
                    type: integer
                    minimum: 1
                  scheduled_arrivals:
                    type: array
                    items:
                      title: BaseFlight
                      type: object
                      properties:
                        ident:
                          type: string
                          description: 'Either the operator code followed by the flight number for the flight

                            (for commercial flights) or the aircraft''s registration (for general

                            aviation).

                            '
                        ident_icao:
                          type: string
                          nullable: true
                          description: 'The ICAO operator code followed by the flight number for the flight (for commercial flights)

                            '
                        ident_iata:
                          type: string
                          nullable: true
                          description: 'The IATA operator code followed by the flight number for the flight (for commercial flights)

                            '
                        actual_runway_off:
                          type: string
                          nullable: true
                          description: 'Actual departure runway at origin, when known

