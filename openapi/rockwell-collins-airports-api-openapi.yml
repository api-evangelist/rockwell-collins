  /airports/{id}/delays:
    get:
      operationId: get_airport_delays
      summary: Get Airport Delay Information
      description: 'Returns a list of reason codes for delays at a specific airport. There

        may be multiple reasons returned if there are multiple types of delays

        reported at an airport. Note that individual flights may be delayed

        without there being an airport delay returned by this endpoint.

        '
      tags:
      - airports
      parameters:
      - name: id
        in: path
        description: 'ICAO, IATA or LID ID of destination airport to fetch. [ICAO is highly preferred](/aeroapi/portal/resources#icaoCode) to prevent ambiguity.

          '
        required: true
        schema:
          type: string
        examples:
          ICAO:
            value: KIAH
          IATA:
            value: IAH
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                title: Airport Delay
                type: object
                properties:
                  airport:
                    type: string
                    description: ICAO/IATA code of airport
                  category:
                    type: string
                    description: 'Category of the largest delay. Some possible values are "weather", "traffic",

                      "equipment", etc.

                      '
                  color:
                    type: string
                    description: Color of largest delay
                    enum:
                    - red
                    - yellow
                    - green
                  delay_secs:
                    type: integer
                    description: 'Duration of largest delay (seconds). This value is not intended to be

                      presented to users and should only be used for sorting results.

                      '
                  reasons:
                    type: array
                    description: Reasons for the delay
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                          description: 'Category for the delay. Some possible values are "weather", "traffic",

                            "equipment", etc.

                            '
                        color:
                          type: string
                          description: Color indicating severity of delay
                          enum:
                          - red
                          - yellow
                          - green
                        delay_secs:
                          type: integer
                          description: 'Duration of delay (seconds). This value is not intended to be

                            presented to users and should only be used for sorting results.

                            '
                        reason:
                          type: string
                          description: Textual description of the cause of the delay
                      required:
                      - category
                      - color
                      - delay_secs
                      - reason
                required:
