                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /airports/{id}/weather/forecast:
    get:
      operationId: get_airport_weather_forecast
      summary: Get Weather Forecast for Given Airport
      description: 'Returns the weather forecast for an airport in the form of a decoded TAF

        (Terminal Area Forecast). Only a single result is returned.

        '
      tags:
      - airports
      parameters:
      - name: id
        in: path
        description: 'ICAO, IATA or LID ID of destination airport to fetch. [ICAO is highly preferred](/aeroapi/portal/resources#icaoCode) to prevent ambiguity.

          '
        required: true
        schema:
          type: string
        examples:
          ICAO:
            value: KIAH
          IATA:
            value: IAH
      - name: timestamp
        in: query
        description: 'Timestamp from which to begin returning weather data in a 1 day range.

          Because weather data is returned in reverse chronological order, all

          returned weather reports will be from before this timestamp. If unspecified,

          weather is returned starting from now up to or less than the user history limit,

          normally 14 days.

          '
        schema:
          type: string
          format: date-time
          example: '2021-12-31T19:59:59Z'
        x-fill-example: 'no'
      - name: return_nearby_weather
        in: query
        description: 'If the requested airport does not have a weather conditions report then

          the weather for the nearest airport within 30 miles will be returned

          instead.

          '
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                title: WeatherForecast
                type: object
                properties:
                  airport_code:
                    type: string
                    description: 'The airport code of the report. LID/IATA will be used if airport lacks an

                      ICAO code.

                      '
                  raw_forecast:
                    type: array
                    description: Array of raw forecast lines from the TAF
                    items:
                      type: string
                  time:
                    type: string
                    format: date-time
                    description: Datetime that the forecast was generated.
                    example: '2021-12-31T19:59:59Z'
                  decoded_forecast:
                    type: object
                    nullable: true
                    properties:
                      start:
                        type: string
                        format: date-time
                        example: '2021-12-31T19:59:59Z'
                      end:
                        type: string
                        format: date-time
                        example: '2021-12-31T19:59:59Z'
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: 'The type of forecast line (forecast, from, temporary, becoming)

                                '
                            start:
                              type: string
                              format: date-time
                              description: Start of the effective period for this forecast line
                              example: '2021-12-31T19:59:59Z'
                            end:
                              type: string
                              format: date-time
                              nullable: true
                              description: End of the effective period for this forecast line
                              example: '2021-12-31T19:59:59Z'
                            turbulence_layers:
                              type: string
                              nullable: true
                              description: Turbulence forecast
                            icing_layers:
                              type: string
                              nullable: true
                              description: Icing forecast
                            barometric_pressure:
                              type: number
                              nullable: true
                              description: Forecast pressure (percent)
                              minimum: 0
                              maximum: 100
                            significant_weather:
                              type: string
                              nullable: true
                              description: Significant weather forecast
                            winds:
                              type: object
                              nullable: true
                              properties:
                                symbol:
                                  type: string
                                  description: Raw TAF wind symbol
                                direction:
                                  type: string
                                  description: Wind direction (0-360 or "variable")
                                speed:
                                  type: integer
                                  description: Wind speed
                                units:
                                  type: string
                                  nullable: true
                                  description: Wind units
                                peak_gusts:
                                  type: integer
                                  nullable: true
                                  description: Peak gusts for forecast
                              required:
                              - symbol
                              - direction
                              - speed
                              - units
                              - peak_gusts
                            windshear:
                              type: object
                              nullable: true
                              properties:
                                symbol:
                                  type: string
                                  description: Raw TAF windshear symbol
                                height:
                                  type: string
                                  description: Altitude of low level wind shear occurrence
                                direction:
                                  type: string
                                  description: Wind direction of windshear (0-360 or "variable")
                                speed:
                                  type: string
                                  description: Wind speed of windshear
                                units:
                                  type: string
                                  nullable: true
                                  description: Wind units of windshear
                              required:
                              - symbol
                              - height
                              - direction
                              - speed
                              - units
                            visibility:
                              type: object
                              nullable: true
                              properties:
                                symbol:
                                  type: string
                                  description: Raw TAF visibility symbol
                                visibility:
                                  type: string
                                  description: Numeric visibility (or "unlimited")
                                units:
                                  type: string
                                  nullable: true
                                  description: Visibility units
                              required:
                              - symbol
                              - visibility
                              - units
                            clouds:
                              type: array
                              items:
                                type: object
                                properties:
                                  symbol:
                                    type: string
                                    description: Raw TAF cloud symbol
                                  coverage:
                                    type: string
                                    nullable: true
                                    description: 'Area of sky covered by the cloud layer (few 0-2 octas, scatterd

                                      3-4 octas, broken 5-7 octas, overcast 8 octas)

                                      '
                                    enum:
                                    - null
                                    - sky_clear
                                    - few
                                    - scattered
                                    - broken
                                    - overcast
                                  altitude:
                                    type: string
                                    nullable: true
                                    description: Height (AGL) of cloud layer base
                                  special:
                                    type: string
                                    nullable: true
                                    description: 'Any special modifiers such as CB (cumulonimbus) or TCU

                                      (towering cumulonimbus)

                                      '
                                required:
                                - symbol
                                - coverage
                                - altitude
                                - special
                          required:
                          - type
                          - start
                          - end
                          - turbulence_layers
                          - icing_layers
                          - barometric_pressure
                          - significant_weather
                          - winds
                          - windshear
                          - visibility
                          - clouds
                    required:
                    - start
                    - end
                    - lines
                required:
                - airport_code
                - raw_forecast
                - time
                - decoded_forecast
        '400':
          description: 'Incorrect parameter (id). Id must be a valid airport code and cannot be empty. Temperature_units may be invalid. Timestamp may be before user''s history limit.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
        '404':
          description: 'No upcoming forecast currently available for this airport.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
  /airports/{id}/routes/{dest_id}:
    get:
      operationId: get_routes_between_airports
      summary: Get Routes Between 2 Airports
      description: 'Returns information about assigned IFR routings between two airports.

        '
      tags:
      - airports
      parameters:
      - name: id
        in: path
        description: 'ICAO, IATA or LID ID of destination airport to fetch. [ICAO is highly preferred](/aeroapi/portal/resources#icaoCode) to prevent ambiguity.

          '
        required: true
        schema:
          type: string
        examples:
          ICAO:
            value: KIAH
          IATA:
            value: IAH
      - name: dest_id
        in: path
        description: 'ICAO, IATA or LID ID of destination airport to fetch. [ICAO is highly preferred](/aeroapi/portal/resources#icaoCode) to prevent ambiguity.

          '
        required: true
        schema:
          type: string
        examples:
          ICAO:
            value: KIAH
          IATA:
            value: IAH
      - name: sort_by
        in: query
        description: 'Field to sort results by. "count" will sort results by the route

          filing count (descending). "last_departure_time" will sort results by

          the latest scheduled departure time for that route (descending).

          '
        schema:
          type: string
          default: count
          enum:
          - count
          - last_departure_time
      - name: max_file_age
        in: query
        description: 'Maximum filed plan age of flights to consider. Can be a value less

          than or equal to 14 days (2 weeks) OR 1 month OR 1 year.

          '
        schema:
          type: string
          default: 2 weeks
        examples:
          days:
            value: 6 days
          month:
            value: 1 month
          year:
            value: 1 year
      - in: query
        name: max_pages
        description: Maximum number of pages to fetch. This is an upper limit and not a guarantee of how many pages will be returned.
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: cursor
        description: 'Opaque value used to get the next batch of data from a paged collection.

          '
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json; charset=UTF-8:
              schema:
                type: object
                properties:
                  links:
                    type: object
                    nullable: true
                    description: 'Object containing links to related resources.

                      '
                    properties:
                      next:
                        type: string
                        format: uri-reference
                        description: 'A link to the next set of records in a collection.

                          '
                    required:
                    - next
                  num_pages:
                    description: Number of pages returned
                    type: integer
                    minimum: 1
                  routes:
                    type: array
                    items:
                      title: RouteInfo
                      type: object
                      properties:
                        aircraft_types:
                          type: array
                          description: List of aircraft types that have filed this route
                          items:
                            type: string
                        count:
                          type: integer
                          minimum: 0
                          description: The number of flights with this filed route
                        filed_altitude_max:
                          type: integer
                          description: The highest altitude filed for the route (hundreds of feet)
                        filed_altitude_min:
                          type: integer
                          description: The lowest altitude filed for the route (hundreds of feet)
                        last_departure_time:
                          type: string
                          format: date-time
                          description: The latest departure time for a flight operating on this route
                          example: '2021-12-31T19:59:59Z'
                        route:
                          type: string
                          description: The IFR route assigned
                        route_distance:
                          type: string
                          description: The distance as filed for the route. May vary from the actual distance flown. Includes units in string.
                      required:
                      - aircraft_types
                      - count
                      - filed_altitude_max
                      - filed_altitude_min
                      - last_departure_time
                      - route
                      - route_distance
                required:
                - links
                - num_pages
                - routes
        '400':
          description: 'Incorrect parameter(s). Id and dest_id must be valid airport codes and cannot be empty. Max_file_age must be one of the specified values.

            '
          content:
            application/json; charset=UTF-8:
              schema:
                title: Error
                type: object
                properties:
                  title:
                    type: string
                    description: Short summary of the type of error encountered.
                  reason:
                    type: string
                    description: Error type name directly from the backend.
                  detail:
                    type: string
                    description: 'More detailed description of the error, possibly including information

                      about specific invalid fields or remediation steps.

                      '
                  status:
                    type: integer
                    description: The HTTP response code returned as part of the error.
                required:
                - title
                - reason
                - detail
                - status
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
