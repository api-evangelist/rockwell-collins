description: >-
  Rockwell Collins was a major American company providing avionics and information technology systems and services to
  government agencies and aircraft manufacturers. In 2018, Rockwell Collins was acquired by United Technologies and
  became part of Collins Aerospace, a subsidiary of RTX Corporation (formerly Raytheon Technologies). Collins Aerospace
  provides flight deck systems, cabin electronics, mission systems, communications, and advanced data services including
  FlightAware AeroAPI for aviation data. The Collins Digital Exchange offers API products for aerospace and defense
  integration.
