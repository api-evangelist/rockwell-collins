    description: AeroAPI — alerts business capability. Self-contained, no shared references.
    resources:
    - name: alerts
      path: /alerts
      operations:
      - name: getallalerts
        method: GET
        description: Get All Configured Alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: max_pages
          in: query
          type: integer
          description: Maximum number of pages to fetch. This is an upper limit and not
        - name: cursor
          in: query
          type: string
          description: Opaque value used to get the next batch of data from a paged collection.
      - name: createalert
        method: POST
        description: Create New Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: alerts-endpoint
      path: /alerts/endpoint
      operations:
      - name: getalertsendpoint
        method: GET
        description: Get Configured Alert Callback URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: setalertsendpoint
        method: PUT
        description: Set Alert Callback URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deletealertsendpoint
        method: DELETE
        description: Remove and Disable Default Account-wide Alert Callback URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: alerts-id
      path: /alerts/{id}
      operations:
      - name: getalert
        method: GET
        description: Get Specific Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatealert
        method: PUT
        description: Modify Specific Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deletealert
        method: DELETE
        description: Delete Specific Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-apikey
      value: '{{env.ROCKWELL_COLLINS_API_KEY}}'
      placement: header
  exposes:
