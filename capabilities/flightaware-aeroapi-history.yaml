naftiko: 1.0.0-alpha2
info:
  label: AeroAPI — history
  description: 'AeroAPI — history. 5 operations. Lead operation: Get Aircraft''s Last Known Flight. Self-contained Naftiko
    capability covering one Rockwell Collins business surface.'
  tags:
  - Rockwell Collins
  - history
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROCKWELL_COLLINS_API_KEY: ROCKWELL_COLLINS_API_KEY
capability:
  consumes:
  - type: http
    namespace: flightaware-aeroapi-history
    baseUri: https://{env}.flightaware.com/aeroapi
    description: AeroAPI — history business capability. Self-contained, no shared references.
    resources:
    - name: history-aircraft-registration-last_flight
      path: /history/aircraft/{registration}/last_flight
      operations:
      - name: gethistoryaircraftlastflight
        method: GET
        description: Get Aircraft's Last Known Flight
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: registration
          in: path
          type: string
          description: The registration number of the aircraft to fetch
          required: true
    - name: history-flights-ident
      path: /history/flights/{ident}
      operations:
      - name: gethistoryflight
        method: GET
        description: Get Information for a Historical Flight
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ident
          in: path
          type: string
          description: The ident, registration, or fa_flight_id to fetch. If using
          required: true
        - name: ident_type
          in: query
          type: string
          description: Type of ident provided in the ident parameter. By default, the passed
        - name: start
          in: query
          type: string
          description: The starting date range for flight results, comparing against flights'
        - name: end
          in: query
          type: string
          description: The ending date range for flight results, comparing against flights'
        - name: max_pages
          in: query
          type: integer
          description: Maximum number of pages to fetch. This is an upper limit and not a guarantee of how many pages will
            be returned.
        - name: cursor
          in: query
          type: string
          description: Opaque value used to get the next batch of data from a paged collection.
    - name: history-flights-id-map
      path: /history/flights/{id}/map
      operations:
      - name: gethistoryflightmap
        method: GET
        description: Get an Image of a Historical Flight's Track on a Map
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The fa_flight_id to fetch
          required: true
        - name: height
          in: query
          type: integer
          description: Height of requested image (pixels)
        - name: width
          in: query
          type: integer
          description: Width of requested image (pixels)
        - name: layer_on
          in: query
          type: array
          description: List of map layers to enable
        - name: layer_off
          in: query
          type: array
          description: List of map layers to disable
        - name: show_data_block
          in: query
          type: boolean
          description: Whether a textual caption containing the ident, type, heading,
        - name: airports_expand_view
          in: query
          type: boolean
          description: Whether to force zoom area to ensure origin/destination airports are
        - name: show_airports
          in: query
          type: boolean
          description: Whether to show the origin/destination airports for the flight as
        - name: bounding_box
          in: query
          type: array
          description: Manually specify the zoom area of the map using custom bounds. Should
    - name: history-flights-id-route
      path: /history/flights/{id}/route
      operations:
      - name: gethistoryflightroute
        method: GET
        description: Get Historical Flight's Filed Route
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The fa_flight_id to fetch
          required: true
    - name: history-flights-id-track
      path: /history/flights/{id}/track
      operations:
      - name: gethistoryflighttrack
        method: GET
        description: Get Historical Information for a Flight's Track
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The fa_flight_id to fetch
          required: true
        - name: include_estimated_positions
          in: query
          type: boolean
          description: Whether to include estimated positions in the flight track
    authentication:
      type: apikey
      key: x-apikey
      value: '{{env.ROCKWELL_COLLINS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: flightaware-aeroapi-history-rest
    port: 8080
    description: REST adapter for AeroAPI — history. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/history/aircraft/{registration}/last-flight
      name: history-aircraft-registration-last-flight
      description: REST surface for history-aircraft-registration-last_flight.
      operations:
      - method: GET
        name: gethistoryaircraftlastflight
        description: Get Aircraft's Last Known Flight
        call: flightaware-aeroapi-history.gethistoryaircraftlastflight
        with:
          registration: rest.registration
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/history/flights/{ident}
      name: history-flights-ident
      description: REST surface for history-flights-ident.
      operations:
      - method: GET
        name: gethistoryflight
        description: Get Information for a Historical Flight
        call: flightaware-aeroapi-history.gethistoryflight
        with:
          ident: rest.ident
          ident_type: rest.ident_type
          start: rest.start
          end: rest.end
          max_pages: rest.max_pages
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/history/flights/{id}/map
      name: history-flights-id-map
      description: REST surface for history-flights-id-map.
      operations:
      - method: GET
        name: gethistoryflightmap
        description: Get an Image of a Historical Flight's Track on a Map
        call: flightaware-aeroapi-history.gethistoryflightmap
        with:
          id: rest.id
          height: rest.height
          width: rest.width
          layer_on: rest.layer_on
          layer_off: rest.layer_off
          show_data_block: rest.show_data_block
          airports_expand_view: rest.airports_expand_view
          show_airports: rest.show_airports
          bounding_box: rest.bounding_box
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/history/flights/{id}/route
      name: history-flights-id-route
      description: REST surface for history-flights-id-route.
      operations:
      - method: GET
        name: gethistoryflightroute
        description: Get Historical Flight's Filed Route
        call: flightaware-aeroapi-history.gethistoryflightroute
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/history/flights/{id}/track
      name: history-flights-id-track
      description: REST surface for history-flights-id-track.
      operations:
      - method: GET
        name: gethistoryflighttrack
        description: Get Historical Information for a Flight's Track
        call: flightaware-aeroapi-history.gethistoryflighttrack
        with:
          id: rest.id
          include_estimated_positions: rest.include_estimated_positions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: flightaware-aeroapi-history-mcp
    port: 9090
    transport: http
    description: MCP adapter for AeroAPI — history. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-aircraft-s-last-known-flight
      description: Get Aircraft's Last Known Flight
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flightaware-aeroapi-history.gethistoryaircraftlastflight
      with:
        registration: tools.registration
      outputParameters:
      - type: object
        mapping: $.
    - name: get-information-historical-flight
      description: Get Information for a Historical Flight
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flightaware-aeroapi-history.gethistoryflight
      with:
        ident: tools.ident
        ident_type: tools.ident_type
        start: tools.start
        end: tools.end
        max_pages: tools.max_pages
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
    - name: get-image-historical-flight-s-track
      description: Get an Image of a Historical Flight's Track on a Map
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flightaware-aeroapi-history.gethistoryflightmap
      with:
        id: tools.id
        height: tools.height
        width: tools.width
        layer_on: tools.layer_on
        layer_off: tools.layer_off
        show_data_block: tools.show_data_block
        airports_expand_view: tools.airports_expand_view
        show_airports: tools.show_airports
        bounding_box: tools.bounding_box
      outputParameters:
      - type: object
        mapping: $.
    - name: get-historical-flight-s-filed-route
      description: Get Historical Flight's Filed Route
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flightaware-aeroapi-history.gethistoryflightroute
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-historical-information-flight-s-track
      description: Get Historical Information for a Flight's Track
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flightaware-aeroapi-history.gethistoryflighttrack
      with:
        id: tools.id
        include_estimated_positions: tools.include_estimated_positions
      outputParameters:
      - type: object
        mapping: $.
